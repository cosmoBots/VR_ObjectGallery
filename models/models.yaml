default_ar: false
disable_ar: true
texture_sky: "eso_milky_way_panorama.jpg"
illumination: "night"
floor_size: [80.0, 80.0]
day_illum:
  ambient_light_energy: 0.28
  directional_light_energy: 2.2
night_illum:
  ambient_light_energy: 2.94
  directional_light_energy: 0.24

models:
  "NRT.glb":
    mqtt_id: "nrt"
    fit_height: false
    fit_depth: false
    fit_width: false
    double_side: false
    place_on_pedestal: false
    show_pedestal: false
    show_cookie: false
    #material_mode: "matte"
    scale: 1
    translation: [0.0, 0.0, 0.0]
    controls:
      yaw:
        mqtt: true
        local_ctrl: "right_stick_x"
        target_node: "Telescope"
        transform: "rotation"
        space: "global"
        axis: "y"
        min: -270.0
        max: 270.0
        speed: 90.0
        round_decimals: 2
        step: 1.0
      pitch:
        mqtt: true
        local_ctrl: "right_stick_y"
        target_node: "Telescope_Structure"
        transform: "rotation"
        axis: "x"
        min: -45.0
        max: 22.0
        speed: 45.0
        round_decimals: 2
        step: 1.0

  "BancoIFU.glb":
    mqtt_id: "banco_ifu"
    fit_height: false
    fit_depth: false
    fit_width: false

    place_on_pedestal: false
    show_pedestal: false
    show_cookie: false
    material_mode: "matte"
    scale: 1.0
    rotation_degrees: [90.0, 0.0, 180.0]
    translation: [0.0, 1.0, 0.0]
    filtered_views:
      view1:
        button: "left_ax_button"
        group: "optics"
        mqtt: true
    controls:
      polarimeter:
        local_ctrl: "right_stick_x"
        target_node: "44V-M70-460_POLARIMETRO_ASS_ASM"
        reset_binding: "right_stick_click"
        reset_key: "O"
        axis: "x"
        min: -0.08
        max: 0.17
        speed: -0.10
        mqtt: true
        round_decimals: 4
        step: 0.0001
      fm1:
        local_ctrl: "right_stick_y"
        target_node: "44V-M70-511_MOUNTANDBASE"
        reset_binding: "right_stick_click"
        reset_key: "O"
        axis: "z"
        min: -0.01
        max: 0.02
        speed: -0.10
        mqtt: true
        round_decimals: 4
        step: 0.0001
