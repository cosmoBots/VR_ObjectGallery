models:
  "BancoIFU.glb":
    mqtt_id: "banco_ifu"
    fit_height: false
    fit_depth: false
    fit_width: false

    place_on_pedestal: false
    show_pedestal: false
    show_cookie: false
    material_mode: "matte"
    scale: 1.0
    rotation_degrees: [90.0, 0.0, 180.0]
    translation: [0.0, 1.0, 0.0]
    filtered_views:
      view1:
        button: "left_ax_button"
        group: "optics"
        mqtt: true
    controls:
      polarimeter:
        local_ctrl: "right_stick_x"
        target_node: "44V-M70-460_POLARIMETRO_ASS_ASM"
        reset_binding: "right_stick_click"
        axis: "x"
        min: -0.08
        max: 0.17
        speed: -0.10
        mqtt: true
      fm1:
        local_ctrl: "right_stick_y"
        target_node: "44V-M70-511_MOUNTANDBASE"
        reset_binding: "right_stick_click"
        axis: "z"
        min: -0.01
        max: 0.02
        speed: -0.10
        mqtt: true
